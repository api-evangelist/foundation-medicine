name: Foundation Medicine
description: 'Foundation Medicine is a molecular information and precision cancer diagnostics
  company that develops comprehensive genomic profiling (CGP) tests for solid tumors,
  blood cancers, and sarcomas, including its FoundationOne family of assays. Its testing
  analyzes patient tumor and liquid-biopsy samples to identify genomic alterations that
  can inform targeted therapy, immunotherapy, and clinical-trial matching, and it partners
  with biopharma on companion diagnostics and clinical-trial enrollment. A Roche company,
  it has delivered more than 1.5 million patient CGP reports and supports 950+ clinical
  trials. This profile was surfaced as a venture-portfolio lead (gv, kleiner-perkins) and
  enriched by the API Evangelist pipeline; the company publishes no public developer API
  or portal, so this record captures its public web, legal, and security-disclosure surface.'
